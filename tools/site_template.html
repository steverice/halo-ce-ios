<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
<meta name="color-scheme" content="light dark">
$head_icons
<link rel="stylesheet" href="style.css">
$head_social
</head>
<body>
<main class="page">
$content
  <footer class="foot">
$legal
  </footer>
</main>
<script>
// GitHub's /releases/latest skips prereleases, and every release before 1.0 is one, so look up the newest release instead.
fetch("https://api.github.com/repos/steverice/visr/releases?per_page=1")
  .then((response) => response.ok ? response.json() : [])
  .then(([release]) => {
    if (!release) return;
    for (const link of document.querySelectorAll('a[href="https://github.com/steverice/visr/releases"]')) link.href = release.html_url;
  })
  .catch(() => {});
</script>
</body>
</html>
