<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<meta property="og:type" content="website">
<meta property="og:site_name" content="VISR">
<meta property="og:title" content="$og_title">
<meta property="og:description" content="$description">
<meta property="og:url" content="https://code.steverice.org/visr/$path">
<meta property="og:image" content="https://code.steverice.org/visr/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The VISR icon, a helmet with a gold visor, beside the VISR wordmark">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<main class="page">
$content
  <footer class="foot">
$legal
  </footer>
</main>
<script>
// GitHub's /releases/latest skips prereleases, and every release before 1.0 is one, so look up the newest release instead.
fetch("https://api.github.com/repos/steverice/visr/releases?per_page=1")
  .then((response) => response.ok ? response.json() : [])
  .then(([release]) => {
    if (!release) return;
    for (const link of document.querySelectorAll('a[href="https://github.com/steverice/visr/releases"]')) link.href = release.html_url;
  })
  .catch(() => {});
</script>
</body>
</html>
