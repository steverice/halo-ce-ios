# iPad6,7 (A9X, 60 Hz): 30 frames a second at 720 lines with lighter shadows, filtering and model detail.
# 60 holds at no measured size (34.7% of d40 frames on time at 720 lines). Offscreen, 720 lines at full quality held 30,
# but presented runs at 30 put only 88.7% (d40) and 90.0% (a10) of frames on time, so the profile also takes the three
# cheapest settings by measured cost. Whether this holds presented has not been checked; the next report decides.
#:schema ../port/settings/profile.schema.json
schema = 1
name = "iPad Pro 12.9-inch (1st generation)"
kind = "model"
status = "provisional"

[match]
platform = "ios"
models = ["iPad6,7"]

[display]
frame_rate = "30"
render_height = 720
shadow_map_size = 128
anisotropic_filtering = 4
model_lod = "auto"

[network]
player_capacity = 8

[evidence."display.frame_rate"]
basis = "measured"
why = "At 60 frames a second and maximum quality 53.7% of d40 frames were on time at 540 lines and 34.7% at 720 (19 rounds). At 30, 720 lines held offscreen (99.91%), but the presented a10 and d40 runs at 30 put 90.0% and 88.7% of frames on time. Hold: after the first second of the window, at least 99.5% of frames within one frame period and at most 0.5% over 1.5 periods, for the median round of every workload."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.render_height"]
basis = "measured"
why = "At 30 frames a second 720 lines held offscreen at 1x (99.91%, 19 rounds) and 900 did not (96.69%). Kept from the previous profile."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.shadow_map_size"]
basis = "measured"
why = "The profile misses its tier in presented play (88.7% and 90.0% of frames on time at 30), and at 64 players on Blood Gulch the GPU took 32 ms a frame at 128-pixel shadows, 36 at 256 and 63 at 512. At 720 lines the d40 frame took 17.66 ms at 128 against 17.88 at 256 and 19.08 at 512, 20 rounds each. Shadow detail is the first setting lowered before a tier (profiles/README.md, Targets): above 128 the game's shadows look little better and cost the most on these GPUs."
source = "VISR shadow map size runs at 128, 256 and 512, mp-bloodgulch-64 on the batched-blur build, 30 s windows, 2026-10-25; VISR settings sweep, build 20261024.122832 (0.5.0), d40-maw-fight, 2026-10-23 to 2026-10-25"

[evidence."display.anisotropic_filtering"]
basis = "measured"
why = "4x filtering took the d40 frame at 720 lines from 19.08 to 18.75 ms (2x: 18.61 ms), 20 rounds each."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.model_lod"]
basis = "measured"
why = "Automatic model detail took the d40 frame at 720 lines from 19.08 to 18.81 ms, 19 rounds."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[scene.menu.display]
frame_rate = "60"

[evidence."scene.menu.display.frame_rate"]
basis = "assumed"
why = "Menus run at 60 as before the gameplay cap; the sweep did not measure menus."

[evidence."network.player_capacity"]
basis = "assumed"
why = "No player count held 30 frames a second at minimum settings on this iPad, so 8, the lowest choice that keeps a game playable at all, is a guess. Provisional until a multiplayer run shows what it holds."
