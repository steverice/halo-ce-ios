#:schema ../port/settings/profile.schema.json
# One quick-suite run per scene on iPhone17,5 at native 2532x1170 and 60 Hz.
# Menu, a10 opening, and b30 beach reported 59.97, 59.96, and 59.91 fps.
# These are submitted-frame estimates; physical display delivery was not measured.
# Reported frame interval p95/p99/worst was 17.3/17.5/17.7, 17.3/17.6/35.0, and
# 17.4/17.7/27.8 ms. Thermal state stayed nominal, with no thermal changes.
# The report's `stalls.count` was zero for its over-50-ms frame-interval threshold.
# This records the measured baseline; no settings sweep or repeat run supports
# alternate values or an optimization.

schema = 1
name = "iPhone 16e"
kind = "model"
status = "provisional"

[match]
platform = "ios"
models = ["iPhone17,5"]

[display]
frame_rate = "60"
render_height = 0
anisotropic_filtering = 16
shadow_map_size = 512
model_lod = "max"
dynamic_resolution = true
dynamic_resolution_floor = 1080

[variable.display]
dynamic_resolution_floor = 540

[evidence."display.anisotropic_filtering"]
basis = "measured"
why = "The quick suite recorded 16x at native 2532x1170 in the menu, a10 opening, and b30 beach runs. The report listed 59.97, 59.96, and 59.91 fps at 60 Hz with nominal thermal state; `stalls.count` reported zero frame-interval stalls over 50 ms. This is a measured baseline, not a comparison of filter settings."
source = "Report HWZD3QQH, build 20261017.73634, quick suite, menu/a10-opening/b30-beach, 2026-10-18 UTC"

[evidence."display.shadow_map_size"]
basis = "measured"
why = "The quick suite recorded a 512 shadow map at native 2532x1170 in the menu, a10 opening, and b30 beach runs. The report listed 59.97, 59.96, and 59.91 fps at 60 Hz with nominal thermal state; `stalls.count` reported zero frame-interval stalls over 50 ms. This is a measured baseline, not a comparison of shadow sizes."
source = "Report HWZD3QQH, build 20261017.73634, quick suite, menu/a10-opening/b30-beach, 2026-10-18 UTC"

[evidence."display.model_lod"]
basis = "measured"
why = "The quick suite recorded max model detail at native 2532x1170 in the menu, a10 opening, and b30 beach runs. The report listed 59.97, 59.96, and 59.91 fps at 60 Hz with nominal thermal state; `stalls.count` reported zero frame-interval stalls over 50 ms. This is a measured baseline, not a comparison of detail levels."
source = "Report HWZD3QQH, build 20261017.73634, quick suite, menu/a10-opening/b30-beach, 2026-10-18 UTC"

[evidence."display.render_height"]
basis = "measured"
why = "Native 2532x1170 (zero: the display's own size) was measured. Stated because the iPhone and iPad class profile's floor is 720 lines."
source = "Report HWZD3QQH, build 20261017.73634, quick suite, menu/a10-opening/b30-beach, 2026-10-18 UTC"

[evidence."display.frame_rate"]
basis = "measured"
why = "Measured on a 60 Hz display (59.91 to 59.97 fps). Stated so a faster display that inherits this profile runs capped at the rate it was measured at."
source = "Report HWZD3QQH, build 20261017.73634, quick suite, 2026-10-18 UTC"

[evidence."display.dynamic_resolution"]
basis = "assumed"
why = "Presented runs on an iPhone 17 Pro at native 2622x1206 and 60 fps, build 20261026.194605: a10-heroic and b30 stayed at the ceiling for every frame with dynamic resolution on (99.93% and 99.94% of frames on time against 99.9% and 100% with it off, GPU median unchanged), so it costs nothing where the GPU keeps up. Blood Gulch with 32 players, where fixed native missed (71.3% on time, 10 late frames, 3 stalls over 50 ms), used 1117 to 1206 lines and finished 84.8% on time with no late frames and no stalls. Measured on the 17 Pro, not on this model."
source = "VISR presented benchmark runs on the iPhone 17 Pro, main c6f138a78, 2026-10-26"

[evidence."display.dynamic_resolution_floor"]
basis = "assumed"
why = "Campaign at 1x enemies is the predictable workload, so the window is 1080 to native (about 8 to 9 percent below the ceiling); the 17 Pro's campaign windows never left the ceiling. Variable games (multiplayer, co-op, enemy multipliers) may go down to the 540 floor."
source = "profiles/README.md, Dynamic resolution in both workloads; VISR presented benchmark runs on the iPhone 17 Pro, main c6f138a78, 2026-10-26"

[evidence."variable.display.dynamic_resolution_floor"]
basis = "assumed"
why = "Blood Gulch with 32 players on the 17 Pro at native needed only 1117 lines to remove every late frame, but heavier maps and 64 players need the wider window the variable workload allows."
source = "VISR presented benchmark runs on the iPhone 17 Pro, main c6f138a78, 2026-10-26"
