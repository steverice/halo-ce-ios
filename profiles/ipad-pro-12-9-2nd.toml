# iPad7,2 (A10X, 120 Hz): 30 frames a second at 900 lines and full quality, from the October 2026 settings sweep.
# 60 does not hold at 900 lines even with every setting at its cheapest (95.4% of a10 frames on time), and 120 holds
# nowhere, so the profile takes the ladder's floor rate with the lines and quality that rate affords: at 30, 900 lines
# held with 1.5x and 2x enemies and every quality setting, and a presented d40 run at 30 showed every frame on time.
# The earlier recipe (720 lines, reduced quality, the display's 120) ran 71 to 82 frames a second, between refreshes.
#:schema ../port/settings/profile.schema.json
schema = 1
name = "iPad Pro 12.9-inch (2nd generation)"
kind = "model"
status = "provisional"

[match]
platform = "ios"
models = ["iPad7,2"]

[display]
upscaled_textures = false
frame_rate = "30"
render_height = 900
anisotropic_filtering = 16
shadow_map_size = 512
model_lod = "max"

[network]
player_capacity = 8

[evidence."display.upscaled_textures"]
basis = "assumed"
why = "The A10X has no Neural Engine that Core ML can use, and upscaled textures are made only on one (a GPU fallback was ruled out). The switch stays off so the Settings app says so."

[evidence."display.frame_rate"]
basis = "measured"
why = "At 900 lines and maximum quality 84.6% (a10) and 83.4% (d40) of frames were within 16.7 ms; with every setting at its cheapest 95.4% and 95.5%. At 1080 lines 64.3% and 67.1%. At 30, 900 lines held 99.89% and 99.95% at 1x and 99.86 to 100% at 1.5x enemies, and the presented d40 run at 30 showed all 2,280 frames on time. Hold: after the first second of the window, at least 99.5% of frames within one frame period and at most 0.5% over 1.5 periods, for the median round of every workload."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.render_height"]
basis = "measured"
why = "At 30 frames a second 1080 lines held at 1x (99.86% and 99.98%, two rounds) but not at 1.5x (a10 98.06%); 900 lines held at 1.5x and 2x, so 900 keeps headroom for busier scenes."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.anisotropic_filtering"]
basis = "measured"
why = "At 30 frames a second and 900 lines every filtering step held 99.9% or more on time; 16x costs 0.4 to 0.5 ms a frame over 2x out of the 33.3 ms budget."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.shadow_map_size"]
basis = "measured"
why = "At 30 frames a second and 900 lines 512-pixel shadows held 99.9% or more on time; they cost 0.4 to 0.7 ms a frame over 128 out of the 33.3 ms budget."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.model_lod"]
basis = "measured"
why = "Automatic model detail changed the frame by -0.13 to +0.05 ms against maximum detail at 900 lines, nothing a 30 frames a second budget needs."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[scene.menu.display]
render_height = 0
frame_rate = "60"

[evidence."scene.menu.display.render_height"]
basis = "assumed"
why = "Keep the previous native-size menu; the sweep did not measure menus."

[evidence."scene.menu.display.frame_rate"]
basis = "assumed"
why = "Menus run at 60 as before the gameplay cap; the sweep did not measure menus."

[scene.cutscene.display]
render_height = 0

[evidence."scene.cutscene.display.render_height"]
basis = "assumed"
why = "Keep the previous native-size cutscene rendering until a cutscene is measured on this model."

[evidence."network.player_capacity"]
basis = "assumed"
why = "At 30 frames a second, minimum settings and 540 lines, even the 16-player game held 88.7% of frames on time. 8 is half of that and was not run on this iPad (12 was not run either). Provisional until rerun."
source = "VISR settings sweep capacity runs, build 20261023.144726 (0.4.2), two rounds at minimum settings and 540 lines, 2026-10-24 and 2026-10-25"
