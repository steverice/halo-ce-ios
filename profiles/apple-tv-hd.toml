# Apple TV HD (2015): A8, 2 GB, GPU family Apple2, no BC textures. Output 1920x1080 at 60 Hz.
#
# Measured on the device on 2026-10-13, unattended, 150 s a run at 960x540 with fast pixel math: a10 from its
# opening cutscene into the first rooms, b30 from the Pelican ride onto the beach. Frames a second are 600-frame
# windows; two runs of the same settings agreed within 1.
#
# Left as the game's defaults, also measured: the high-res HUD and text (display.high_res_hud, high_res_text).
# Off, they change no frame time and lower peak memory from 509 to 449 MB on a10 and from 660 to 466 MB on b30,
# of about 1,450 MB the system allows; in a replayed take the peak was 566 MB without them against 775 to 797.
# They stay on by decision, until the HUD is drawn at the display's own size.

# Measured again on 2026-10-14 on the play build with full LTO and PGO, the native HUD and the frame pacer
# (scratch/native-hud-tv 6e38fb332, build 20261014.091123), unattended, 150 s a run: the values below stay. b30's
# beach on Easy at 540: 42.4 and 42.5 frames a second in two runs (CPU 20.4 ms, GPU 23.6 to 23.9 ms a frame, the
# medians of 600-frame windows), against about 48 on 2026-10-13's build (CPU 21.9, GPU 22.7): the CPU gained 1.5 ms,
# the GPU lost about 1 ms to the HUD drawn at the display's size. At 648 the beach ran 35.0 (GPU 29.1 ms). FXAA
# (display.anti_aliasing = "fxaa") cost about 6 ms of GPU at 540 in play (33.9 frames a second, GPU 30.0 ms), 4.5 ms
# in the menu at 720 (59.1, slowest window 56.8) and 3 ms in cutscenes at 648 (29.2, slowest 23.5): left off.

schema = 1
name = "Apple TV HD"
kind = "model"

[match]
platform = "tvos"
models = ["AppleTV5,3"]

# Gameplay. The class profile's render height is 1080; half of it each way is 960x540.
[display]
frame_rate = "30"
texture_idle_seconds = 30
render_scale = 0.5
anisotropic_filtering = 4
model_lod = "auto"
shadow_map_size = 256

[network]
player_capacity = 8

[evidence."display.frame_rate"]
basis = "measured"
why = "Decided for this device: gameplay holds no tier of the ladder at 60. Presented at 540 lines with the cheapest settings, 97.7 to 99.4% of frames came within two refreshes, so uncapped play alternates between 60 and 30. Capped at 30, each frame stays up two refreshes, as cutscenes already do. The menu keeps the display's rate."
source = "Apple TV HD presented runs of a10 and d40 at 540 lines and minimum settings, settings sweep of 2026-10-24 and 25"

[evidence."display.texture_idle_seconds"]
basis = "assumed"
why = "About 1,450 MB of the 2 GB is available to the app and b30 peaks at 660 MB with the high-res HUD off and 775 to 797 MB on, so unused textures should go sooner than the 60 second default. 30 seconds is half the default and equals the 1800-frame window at 60 frames a second. Not measured: the memory the shorter window frees."

[evidence."display.render_scale"]
basis = "measured"
why = "The A8's GPU is the limit. At 1080 b30's beach ran 12 to 18 frames a second and at 720 about 22; at 540 with fast pixel math it ran 30 to 43, and a10 held 57 to 60 walking and 42 to 54 in fights. The player called 540 smooth and playable. Written as a scale of the class's 1080, not as a render height, because the scale can change by scene class and the height cannot."
source = "Apple TV HD runs of a10 and b30 at 1080, 720 and 540, 600-frame windows, 2026-10-12; hands-on session 2026-10-13"

[evidence."display.anisotropic_filtering"]
basis = "measured"
why = "The largest single cost found. Against 16x, 4x took b30's Pelican ride from 42 to 54-57 frames a second and the beach from 31 to 34-38 (GPU 30.5 to 26 ms a frame), and a10's rooms from 44-53 to 47-57. 2x gave 2 to 5 more on the beach but the ground blurs visibly a few meters out in the screenshots; at 4x the difference from 16x shows only in the far distance."
source = "Apple TV HD sweep: a10 and b30 at 16x, 4x and 2x, screenshots at 60 and 120 s, 2026-10-13"

[evidence."display.model_lod"]
basis = "measured"
why = "The game's own choice of model detail by size on screen, as the Xbox made it, against always the highest. b30's beach went from 31 to 35-36 frames a second (CPU 26 to 21.5 ms a frame, GPU 30.5 to 27.7), with a third of its models at lower levels; the screenshots at 540 could not be told apart. a10's interiors gained only in their heaviest window (36 to 43)."
source = "Apple TV HD sweep: a10 and b30, max against auto, 2026-10-13"

[evidence."display.shadow_map_size"]
basis = "measured"
why = "256 against 512 gained 2 to 5 frames a second in a10's rooms with characters (53 to 56, 49 to 53, 51 to 54) and 1 to 2 on b30; 128 gained about 1 more. 256 keeps shadow edges smoother than the Xbox's 128 for most of the gain."
source = "Apple TV HD sweep: a10 and b30 at 512, 256 and 128, 2026-10-13"

# All three together: b30's beach 31 to 40-53 frames a second (GPU 30.5 to 23 ms, CPU 26 to 22), its Pelican ride
# 42 to 54-60; a10's rooms 44-53 to 48-58. Peak memory unchanged.

# The main menu at 720 lines.
[scene.menu.display]
render_scale = 0.6667
frame_rate = "display"

[evidence."scene.menu.display.render_scale"]
basis = "measured"
why = "At 1080 the still menu held 60 (GPU 12.4 to 14.5 ms of the 16.7 available), but moving through the menus in a played session it ran 53.5 frames a second, the slowest window 51.7. At 720 the menu takes 10 to 11 ms of GPU time."
source = "Apple TV HD menu runs at 540, 720 and 1080, 60 s each, and the played session of 2026-10-13 (14:34)"

# Cutscenes: about 650 lines at 30 frames a second, as the original played them.
[scene.cutscene.display]
render_scale = 0.6
frame_rate = "30"

[evidence."scene.menu.display.frame_rate"]
basis = "measured"
why = "The menu at 720 takes 10 to 11 ms of GPU time and held 60, so it keeps the display's rate under the gameplay cap."
source = "Apple TV HD menu runs at 720, 2026-10-13"

[evidence."scene.cutscene.display.render_scale"]
basis = "measured"
why = "At 720 a10's cutscenes held 29.3 to 29.9 frames a second overall, but their heaviest windows ran 26.9 to 28.9 with 50 ms frames. At 1152x648 a played session's cutscenes held 29.9 overall, the slowest 5-second window 27.8."
source = "Apple TV HD replays of a played take at 720, 2026-10-13; the hand-played session of 2026-10-13 (21:39) at 648, build 20261013.205745"

[evidence."scene.cutscene.display.frame_rate"]
basis = "measured"
why = "Decided for this device: a cutscene's cost is scripted, and at 540 it already uses most of a 60 Hz frame, so the sharper picture is bought with the original's 30 frames a second. Each frame stays up two refreshes: a steady 30.0 with a 95th percentile frame of 33.9 ms in a10's opening."
source = "Apple TV HD runs of a10 with the 30 cap, and replays of a played take, 2026-10-13"

[evidence."network.player_capacity"]
basis = "assumed"
why = "No player count held 30 frames a second at minimum settings on this Apple TV, so 8, the lowest choice that keeps a game playable at all, is a guess. Provisional until a multiplayer run shows what it holds."
