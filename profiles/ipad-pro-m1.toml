schema = 1
name = "iPad Pro 12.9-inch (M1)"
kind = "model"

[match]
platform = "ios"
models = ["iPad13,8", "iPad13,9", "iPad13,10", "iPad13,11"]

[display]
anisotropic_filtering = 16
shadow_map_size = 512
mirror_resolution = "half"

[evidence."display.anisotropic_filtering"]
basis = "measured"
why = "16x against off cost 0.1 ms of GPU time a frame."
source = "iPad settings sweep, a10 benchmark at 3180x2384, 2026-10-03"

[evidence."display.shadow_map_size"]
basis = "measured"
why = "1024 cost 0.9 to 2.7 ms of GPU time a frame and 2048 1.3 to 3.1 (the device warmed during the sweep); 128 against 512 made no difference."
source = "iPad settings sweep, a10 benchmark, 2026-10-03"

[evidence."display.mirror_resolution"]
basis = "measured"
why = "On c40's mirror floors, full took GPU time from about 9 ms to 13.7 ms a frame and the frame from 8.3 ms to 13.1."
source = "iPad mirror runs, c40, 2026-10-03"
