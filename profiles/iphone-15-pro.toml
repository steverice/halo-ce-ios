#:schema ../port/settings/profile.schema.json
# A17 Pro: native 2556x1179 (15 Pro) or 2796x1290 (15 Pro Max), capped at 60.
# UYY37PNG's 20 campaign windows, including 1.5x and 2x enemies, presented
# 99.666% to 100% on time at 60 with nominal thermal state throughout.
# Actual presentation p90 was 16.670 ms, within the 16.7 ms budget at the
# timing checks' 0.1 ms precision; submission p90 was 17.2 to 17.4 ms.
# LYY9JBRZ's uncapped a10 1.5x window averaged 102.60 fps, but presentation
# p90 was 16.670 ms and only 83.220% presented on time at 120. It does not
# qualify tier 5. XPBNZMAZ has one complete window and a partial 1.5x window;
# this profile remains provisional, especially for the smaller phone.

schema = 1
name = "iPhone 15 Pro, 16 Pro, 17 and Air"
kind = "model"
status = "provisional"

[match]
platform = "ios"
models = ["iPhone16,1", "iPhone16,2", "iPhone17,1", "iPhone17,2", "iPhone18,3", "iPhone18,4"]

[display]
frame_rate = "120"
render_height = 0
anisotropic_filtering = 16
shadow_map_size = 512
model_lod = "max"
dynamic_resolution = true
dynamic_resolution_floor = 1080

[variable.display]
frame_rate = "60"
dynamic_resolution_floor = 540

[external.display]
output_height = 1440
render_height = 1440

[network]
player_capacity = 32

[evidence."display.frame_rate"]
basis = "assumed"
why = "Steve 2026-10-27: Pro iPhones target 120 in campaign; validate with benchmarks. Steve chose the same 120 for the iPhone 17 and iPhone Air the same day (\"17 and air should get 120 for campaign\"). The earlier settings sweep did not hold 120 at maximum quality (variable games keep 60, below)."
source = "Steve, 2026-10-27"

[evidence."variable.display.frame_rate"]
basis = "measured"
why = "Keep 60: UYY37PNG's 20 native-resolution campaign windows, including 1.5x and 2x enemies, delivered 99.666% to 100% of actual presentation intervals within the 60 fps budget at 0.1 ms precision, with nominal thermal state throughout. The slowest window averaged 59.84 fps, with presentation median/p90/p99 16.670/16.670/16.670 ms and maximum 66.682 ms (three intervals over 25 ms). XPBNZMAZ's complete a10 window averaged 59.88 fps with 99.833% on time. LYY9JBRZ at native 120 Hz fails the higher tier even before heating: a10 1.5x averaged 102.60 fps, presentation p90 16.670 ms against an 8.3 ms budget, only 83.220% on time. No measured lower-cost configuration establishes 120 fps with 1.5x enemies."
source = "Reports XPBNZMAZ and UYY37PNG, build 20261023.212823, campaign, 2026-10-24 UTC; LYY9JBRZ, build 20261022.222500, a10-heroic-x1-5, 2026-10-23 UTC"

[evidence."display.render_height"]
basis = "measured"
why = "Native 2556x1179 and 2796x1290 are the highest measured built-in sizes. Actual presentation p90 decoded by nearest rank from the retained per-frame traces is 16.670 ms in XPBNZMAZ's complete window and every UYY37PNG window, within the 60 fps budget at 0.1 ms precision. This overrides the class's 720-line floor. The capped submission intervals have p90 17.2 to 17.4 ms; they are not display delivery. No 120 fps resolution is qualified with the required 1.5x workload."
source = "Reports XPBNZMAZ and UYY37PNG, build 20261023.212823, native built-in output, 2026-10-24 UTC"

[evidence."display.anisotropic_filtering"]
basis = "measured"
why = "Retain the measured 16x baseline: all 20 UYY37PNG windows meet the native 60 fps presentation hold rule with it, including the enemy-multiplier windows. XPBNZMAZ's complete window also holds. There is no matched active-gameplay cost comparison showing that reduced filtering would qualify the next tier; older stationary b30 knob trials do not establish that."
source = "Reports XPBNZMAZ and UYY37PNG, build 20261023.212823, campaign settings and renderer snapshots, 2026-10-24 UTC"

[evidence."display.shadow_map_size"]
basis = "measured"
why = "Retain the measured 512 shadow target: all 20 UYY37PNG windows meet the native 60 fps presentation hold rule with it; XPBNZMAZ's complete window also holds. No matched active-gameplay sweep establishes a saving from smaller shadows sufficient for 120 fps at 1.5x enemies."
source = "Reports XPBNZMAZ and UYY37PNG, build 20261023.212823, campaign settings and renderer snapshots, 2026-10-24 UTC"

[evidence."display.model_lod"]
basis = "measured"
why = "Retain max model detail: the complete XPBNZMAZ window and all 20 UYY37PNG windows hold native 60 fps with this setting, anti-aliasing off, half-resolution effects and no texture replacements loaded. No matched active-gameplay measurement justifies lowering detail or enabling extra quality settings. Higher multiplayer player counts are separate workloads and are not qualified by this campaign profile."
source = "Reports XPBNZMAZ and UYY37PNG, build 20261023.212823, campaign settings and renderer snapshots, 2026-10-24 UTC"

[evidence."display.dynamic_resolution"]
basis = "assumed"
why = "Presented runs on an iPhone 17 Pro at native 2622x1206 and 60 fps, build 20261026.194605: a10-heroic and b30 stayed at the ceiling for every frame with dynamic resolution on (99.93% and 99.94% of frames on time against 99.9% and 100% with it off, GPU median unchanged), so it costs nothing where the GPU keeps up. Blood Gulch with 32 players, where fixed native missed (71.3% on time, 10 late frames, 3 stalls over 50 ms), used 1117 to 1206 lines and finished 84.8% on time with no late frames and no stalls. Measured on the 17 Pro, not on this model."
source = "VISR presented benchmark runs on the iPhone 17 Pro, main c6f138a78, 2026-10-26"

[evidence."display.dynamic_resolution_floor"]
basis = "assumed"
why = "Campaign at 1x enemies is the predictable workload, so the window is 1080 to native (about 8 to 9 percent below the ceiling); the 17 Pro's campaign windows never left the ceiling. Variable games (multiplayer, co-op, enemy multipliers) may go down to the 540 floor."
source = "profiles/README.md, Dynamic resolution in both workloads; VISR presented benchmark runs on the iPhone 17 Pro, main c6f138a78, 2026-10-26"

[evidence."variable.display.dynamic_resolution_floor"]
basis = "assumed"
why = "Blood Gulch with 32 players on the 17 Pro at native needed only 1117 lines to remove every late frame, but heavier maps and 64 players need the wider window the variable workload allows."
source = "VISR presented benchmark runs on the iPhone 17 Pro, main c6f138a78, 2026-10-26"

[evidence."external.display.output_height"]
basis = "assumed"
why = "Estimated from built-in measurements, not measured on a wired display. A 2560x1600 monitor at 1440 lines draws 2304x1440 (3.3 million pixels), about 1.1 times the 3.0 million of this class's measured native 2556x1179, which held 60 frames a second (99.7 to 100% on time, thermal nominal) on the iPhone 15 Pro. Presentation p90 at native was already at the 16.7 ms budget, so the iPhone 15 Pro class gets 1440 and not the monitor's full 1600 lines (4.1 million pixels, 1.4 times the measured load). The earlier 1080 cap was a placeholder pending measurements."
source = "Reports XPBNZMAZ and UYY37PNG, build 20261023.212823, native built-in output, 2026-10-24 UTC; Steve, 2026-10-27"

[evidence."external.display.render_height"]
basis = "assumed"
why = "Rendering follows the output cap: the drawable is the monitor's own shape at up to 1440 lines, scaled to the monitor by the layer. Estimated, not measured on a wired display; dynamic resolution (on, floor 1080) is the safety net if a monitor proves heavier than estimated."
source = "Reports XPBNZMAZ and UYY37PNG, build 20261023.212823, native built-in output, 2026-10-24 UTC; Steve, 2026-10-27"

[evidence."network.player_capacity"]
basis = "assumed"
why = "Steve's decision on 2026-10-27 to match the iPhone 17 Pro's 32: the same A17 Pro/A18 class of GPU, not measured separately on this model. The 17 Pro held Sidewinder with 128 players at 30 frames a second, minimum settings and 540 lines, and 32 is half of Blood Gulch's failing 64 there."
source = "iphone-17-pro.toml network.player_capacity evidence; Steve, 2026-10-27"
