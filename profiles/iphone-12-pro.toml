# iPhone13,3 (iPhone 12 Pro, A14, 60 Hz): 30 frames a second at 900 lines and full quality, from the October 2026
# settings sweep. 60 holds at no measured size, even at 720 lines with every setting at its cheapest (94.0% of a10
# frames on time), so the profile takes the ladder's floor rate with the lines and quality that rate affords. Before
# this profile the model fell to the iPhone and iPad class, 60 at 720 lines, which put 72% of frames on time.
#:schema ../port/settings/profile.schema.json
schema = 1
name = "iPhone 12 Pro"
kind = "model"
status = "provisional"

[match]
platform = "ios"
models = ["iPhone13,3"]

[display]
frame_rate = "30"
render_height = 900
anisotropic_filtering = 16
shadow_map_size = 512
model_lod = "max"

[evidence."display.frame_rate"]
basis = "measured"
why = "At 720 lines and maximum quality 71.8% (a10) and 72.7% (d40) of frames were within 16.7 ms (17 rounds each); with every setting at its cheapest 94.0% and 95.7%. At 30, 900 lines held 99.86% and 100% at 1x and 100% at 1.5x enemies, and the presented d40 run at 30 and 720 lines showed all 2,273 frames on time. Hold: after the first second of the window, at least 99.5% of frames within one frame period and at most 0.5% over 1.5 periods, for the median round of every workload."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.render_height"]
basis = "measured"
why = "At 30 frames a second 900 lines held and 1080 did not (a10 98.75%, 17 rounds)."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.anisotropic_filtering"]
basis = "measured"
why = "At 30 frames a second and 720 lines every filtering step held 99.9% or more on time; 16x costs 0.9 to 1.3 ms a frame over 2x out of the 33.3 ms budget."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.shadow_map_size"]
basis = "measured"
why = "At 30 frames a second and 720 lines 512-pixel shadows held 99.9% or more on time; they cost 0.8 to 1.4 ms a frame over 128 out of the 33.3 ms budget."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.model_lod"]
basis = "measured"
why = "Maximum against automatic model detail cost 0.17 to 0.23 ms a frame at 720 lines."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[scene.menu.display]
frame_rate = "60"

[evidence."scene.menu.display.frame_rate"]
basis = "assumed"
why = "Menus run at 60 as before the gameplay cap; the sweep did not measure menus."
