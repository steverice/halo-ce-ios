#:schema ../../port/settings/catalog.schema.json
# Tiers order hardware within a platform, not model identifiers or release dates, and a source may be inherited only by hardware at or above its tier.
# iOS holds two disjoint ranges so an iPhone never inherits an iPad's profile: iPhones 100 to 199, iPads 1000 to 1999 (an iPad reaches an
# iPhone source only when every iPad source fails its envelope, and the iPhone sources' memory floors exclude every iPad below 8 GB).
# Within a range, a tier orders GPU capability: the design generation, then the GPU core count (each entry's source gives the basis).
# Hardware whose ordering against its neighbors cannot be defended would have no tier and keep its class profile.
schema = 1
version = "2026-10-25"

