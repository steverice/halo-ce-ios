# Every iPhone and iPad without a profile of its own: Metal, and otherwise the built-in defaults.
# Split this class by GPU family when a measurement on an older device shows it needs different values.

schema = 1
name = "iPhone and iPad"
kind = "class"

[match]
platform = "ios"
gpu_family = [1, 0]

[display]
renderer = "metal"

[evidence."display.renderer"]
basis = "measured"
why = "The Metal backend is the project's renderer, and the OpenGL ES path lacks the Metal performance work (shadow-map and decal batching, pipeline caching, frame pacing). On the Apple TV HD, Metal ran the menu, a10 and b30 with no Metal error; the Metal menu and a10 replays match the OpenGL ES records on the Mac runner."
source = "check-metal (menu and a10, Metal against the GL records) and Apple TV HD runs, 2026-10-14"
