# Apple TV 4K, 1st generation (2017, model A1842): A10X Fusion, 3 GB, GPU family Apple3.
# Measured in the 0.5.0 build (20261025.150026, 2026-10-25) at render 720: on a 720p TV the model holds
# 60 frames a second at up to 2x enemies (on-time 0.9956 or better in every window). On a 4K TV with output
# capped it reaches 59.4 frames a second at 99.0% on time (full-4K drawable in 0.4.1: 55.0 and 90.7%).
# Settings other than the render and output heights are still estimates scaled from the Apple TV HD.
# Least sure, so the first things to sweep: the render height (720, 900, 1080), then anisotropic filtering
# (4, 8, 16), then the model detail.

schema = 1
name = "Apple TV 4K (1st generation)"
kind = "model"
status = "provisional"

[match]
platform = "tvos"
models = ["AppleTV6,2"]

[display]
render_scale = 1.0
shadow_map_size = 512
texture_idle_seconds = 30
render_height = 720
output_height = 1080
anisotropic_filtering = 4
model_lod = "auto"

[scene.menu.display]
render_scale = 1.0

[evidence."display.texture_idle_seconds"]
basis = "assumed"
why = "This device has 3 GB, the tightest memory after the Apple TV HD. 30 seconds is half the 60 second default and equals the 1800-frame window at 60 frames a second. Not measured: the memory the shorter window frees."

[evidence."display.render_height"]
basis = "assumed"
why = "The Apple TV HD's A8 needed 23 to 30 ms of GPU time a frame on b30's beach at 540 with these settings. An A10X's GPU is about five to six times an A8's in published benchmarks, and it has no relaxed pixel math and runs the safe mode, about a fifth slower than the fast mode the A8 was measured with. That puts 1080 (four times 540's pixels) at roughly 20 to 30 ms, over a 60 Hz frame, and 720 (1.8 times) at 9 to 13, inside it. 720 until measured."

[evidence."display.anisotropic_filtering"]
basis = "assumed"
why = "On the Apple TV HD 16x was the largest single cost (b30's beach 31 frames a second against 34 to 38 at 4x); on an iPad Pro (M1) it was free. An A10X is between the two and nearer the first in age: 4x, as on the HD, until measured."

[evidence."display.model_lod"]
basis = "assumed"
why = "The game's own choice of detail by size on screen: on the Apple TV HD it took b30's CPU time from 26 to 21.5 ms a frame with no visible difference at 540. An A10X's CPU is about two and a half times an A8's, so this is headroom, not need; at 720 the lower levels may show more than they did at 540."

[scene.cutscene.display]
render_scale = 1.0
frame_rate = "display"

[evidence."display.render_scale"]
basis = "assumed"
why = "Pinned to the built-in default so the Apple TV class profile's floor (the Apple TV HD's value) does not reach this model; not separately measured."

[evidence."display.shadow_map_size"]
basis = "assumed"
why = "Pinned to the built-in default so the Apple TV class profile's floor (the Apple TV HD's value) does not reach this model; not separately measured."

[evidence."scene.menu.display.render_scale"]
basis = "assumed"
why = "Pinned to the built-in default so the Apple TV class profile's floor (the Apple TV HD's value) does not reach this model; not separately measured."

[evidence."scene.cutscene.display.render_scale"]
basis = "assumed"
why = "Pinned to the built-in default so the Apple TV class profile's floor (the Apple TV HD's value) does not reach this model; not separately measured."

[evidence."scene.cutscene.display.frame_rate"]
basis = "assumed"
why = "Pinned to the built-in default so the Apple TV class profile's floor (the Apple TV HD's value) does not reach this model; not separately measured."

[evidence."display.output_height"]
basis = "measured"
why = "On a 4K TV with the scene at 720 lines, handing the Apple TV a 1080 image tied a 720 image when both ran cool (on-time 0.991 in the 8 windows where both were thermally nominal; GPU mean 14.1 against 14.7 ms over all windows), against the full 4K drawable baseline at 55.0 frames a second and 0.907 on time. 1080 gives the HUD and text 1.5 times the lines and gives 1080p TVs a native picture. The cap only lowers output, so 720p TVs are unchanged. Steve's decision."
source = "TestFlight 0.5.0 benchmark reports X6RJWBVJ, 3LADMGUU, U764MX75 (4K TV) and ZGVMKGQJ (0.4.1 baseline), build 20261025.150026, 2026-10-25"
