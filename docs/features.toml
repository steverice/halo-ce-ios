# Shared public facts. Run python3 tools/build_site.py after editing.

[cloud_saves]
summary = "Your saves and player profiles sync across your devices through iCloud."
platforms = ["iPhone", "iPad", "Apple TV"]
condition = "builds made with cloud saves"
exceptions = ["Mac"]
synced = [
    "player profiles (including controls)",
    "finished levels",
    "the Save and Quit checkpoint",
    "custom game types",
]
excluded = ["config.toml settings"]

[shared]
introduction = "VISR is a native port of Halo: Combat Evolved for Apple Vision Pro and other Apple devices: iPhone, iPad, Apple TV and Mac. Based on a lot of hard work from the community, optimized for Metal and Apple Silicon."
goal = "The goal is to provide the best possible way to experience Halo while staying faithful to the original game. VISR builds on my love of the game and the many thousands of hours I have spent playing it."
legal = '''
Halo, Halo: Combat Evolved, Master Chief and the related names and logos are
trademarks of Microsoft Corporation. Halo: Combat Evolved © Microsoft
Corporation. VISR is an unofficial fan project. It is not affiliated with,
sponsored by or endorsed by Microsoft, Xbox Game Studios, Halo Studios
(formerly 343 Industries) or Bungie.

VISR does not include or distribute the game's maps, sounds, textures, videos or other content, and it does not help you obtain them. You need a disc image of the original Xbox game, made from your own disc. VISR is free and is not sold.

It builds on the Halo: CE decompilation, [OpenCE](https://github.com/OpenCommunityEdition/OpenCE) and the other projects in its [credits](https://github.com/steverice/visr#credits). The code is licensed under [Apache-2.0](https://github.com/steverice/visr/blob/main/LICENSE). It includes code that originated in CC0 1.0 projects, credited in the [notices](https://github.com/steverice/visr/blob/main/NOTICE.md).

Apple, iPhone, iPad, Apple TV, Mac, Vision Pro and Metal are trademarks of Apple Inc.'''
tailored = "VISR is tailored to each Apple device, so it just works."

[platforms.vision-pro]
name = "Apple Vision Pro"
deployment = "visionos"
devices = ["M2 Vision Pro", "M5 Vision Pro"]
bullets = [
    "Full stereo VR with head tracking and foveated rendering",
    "Gameplay elements reimagined for a first-class VR experience",
    "The HUD in CE's own corners, out in the periphery, following the body's turn rather than the head",
    "Scope zoom fills the view",
    "Third-person cutscenes on a large 3D screen in the room",
    "Support for PlayStation VR2 Sense controllers",
    "Supports both M2 and M5 Vision Pro",
]

[platforms.iphone-and-ipad]
name = "iPhone and iPad"
deployment = "ios"
devices = ["iPhone 8 or newer", "iPad"]
bullets = [
    "Built-in touch controls for an on-the-go experience",
    "Full controller support",
    "Play on a connected TV or monitor",
    "iOS {ios_minimum}+, iPhone 8 or newer",
]

[platforms.apple-tv]
name = "Apple TV"
deployment = "tvos"
devices = ["Apple TV"]
bullets = [
    "Full controller support",
    "Split-screen multiplayer on one TV",
]

[platforms.mac]
name = "Mac"
deployment = "macos"
devices = ["Mac"]
bullets = [
    "Native AppKit app",
    "Keyboard and mouse support",
]

