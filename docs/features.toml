# Shared public facts. Run python3 tools/build_site.py after editing.

[every-device]
# Each item is a column on the site (icon from docs/site/icons/) and a bullet in the README.
items = [
    { icon = "cloud", title = "Cross-device sync", text = "Your saves and player profiles sync across all your devices through iCloud. Zero setup required." },
    { icon = "just-works", title = "It just works", text = "VISR is specifically optimized for each Apple device for [unmatched performance](benchmarks.html) out of the box." },
    { icon = "community", title = "Compatible with the community", text = "VISR aims for cross-play with the popular Halo: CE ports like [OpenCE](https://github.com/OpenCommunityEdition/OpenCE) and [Chupathingy](https://chupathingy.org)." },
    { icon = "license", title = "Permissive license", text = "All VISR code is [Apache-2.0](https://github.com/steverice/visr/blob/main/LICENSE), so you can use it in any port, mod, tool or server, under any license." },
]

[shared]
introduction = "VISR is a native port of Halo: Combat Evolved for Apple Vision Pro and other Apple devices: iPhone, iPad, Apple TV and Mac. Based on a lot of hard work from the community, optimized for Metal and Apple Silicon."
goal = "VISR aims to provide the best possible way to experience Halo while staying faithful to the original game. VISR builds on my love of the game and the many thousands of hours I have spent playing it."
legal = '''
Halo, Halo: Combat Evolved, Master Chief and the related names and logos are
trademarks of Microsoft Corporation. Halo: Combat Evolved © Microsoft
Corporation. VISR is an unofficial fan project. It is not affiliated with,
sponsored by or endorsed by Microsoft, Xbox Game Studios, Halo Studios
(formerly 343 Industries) or Bungie.

VISR does not include or distribute the game's maps, sounds, textures, videos or other content, and it does not help you obtain them. You need a disc image of the original Xbox game, made from your own disc. VISR is free and is not sold.

It builds on the Halo: CE decompilation, [OpenCE](https://github.com/OpenCommunityEdition/OpenCE) and the other projects in its [credits](https://github.com/steverice/visr#credits). The code is licensed under [Apache-2.0](https://github.com/steverice/visr/blob/main/LICENSE). It includes code that originated in CC0 1.0 projects, credited in the [notices](https://github.com/steverice/visr/blob/main/NOTICE.md).

All VISR code is licensed under Apache-2.0 so you can use it in any project under any license: another port, a mod, a tool, a dedicated server, a GPL or AGPL project, or something closed. There is no obligation to distribute your code just to play with others. And you're safe from any patent claims by VISR's contributors.

Apple, iPhone, iPad, Apple TV, Mac, Vision Pro and Metal are trademarks of Apple Inc. [Privacy policy](https://code.steverice.org/visr/privacy.html).'''

[platforms.vision-pro]
name = "Apple Vision Pro"
deployment = "visionos"
devices = ["M2 Vision Pro", "M5 Vision Pro"]
bullets = [
    "A whole new way to experience Halo",
    "Full stereo VR with head tracking and foveated rendering",
    "Gameplay elements reimagined for a first-class VR experience",
    "Immersive cutscenes true to the directorial intent",
    "Supports PlayStation VR2 Sense controllers for hand-tracked gunplay",
    "Works on both M2 and M5 Vision Pro",
    "visionOS {visionos_minimum} or later",
]

[platforms.iphone-and-ipad]
name = "iPhone and iPad"
deployment = "ios"
devices = ["iPhone 8 or newer", "iPad"]
bullets = [
    "Built-in touch controls for an on-the-go experience",
    "Full controller support",
    "Play on a TV or monitor via cable or AirPlay",
    "iPhone 8 or newer",
    "iOS/iPadOS {ios_minimum} or later",
]

[platforms.apple-tv]
name = "Apple TV"
deployment = "tvos"
devices = ["Apple TV"]
bullets = [
    "Full controller support",
    "Split-screen multiplayer on one TV",
    "Apple TV HD or 4K",
    "tvOS {tvos_minimum} or later",
]

[platforms.mac]
name = "Mac"
deployment = "macos"
devices = ["Mac"]
bullets = [
    "Native AppKit app",
    "Keyboard and mouse support",
    "Any size, full screen or windowed",
    "Any Apple Silicon Mac, macOS {macos_minimum} or later",
]

