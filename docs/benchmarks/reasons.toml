# Plain-language text for the codes the sheet keeps. The page shows these; the sheet and CSV keep the codes.

[exact]
"safari-remote-automation-disabled" = "Safari could not be automated on this Mac."
"console-unavailable" = "The app has no frame-time readout we could capture."
"not measured on the reference box" = "Not run on this platform's reference device."
"no uncapped 2560×1920 matched-stock measurement" = "Only measured with the frame cap on, at another size or with other settings."
"no uncapped matched-stock measurement" = "Only measured with the frame cap on or with other settings."
"no measurement at the display rate" = "Only measured with other frame-rate or quality settings."
"not measured yet" = "Not run on this device yet."
"no unattended console" = "This port has no way to start this suite without a person at the keyboard."
"no frames in the trace" = "The timing trace held no frames for this window."
"engine assertion (terminal.c:413)" = "The game halts on an engine assertion during this window."
"the game reverted to a checkpoint in every round" = "The game reverted to a checkpoint in every round."
"no console in the web build" = "The web build has no console a script can drive, so this suite cannot be started."
"not reachable: no console" = "The app has no console a script can drive, so this suite cannot be started."
"permission-denied" = "The system did not allow the measurement."

[patterns]
# {suite} and {suites} are filled from the code.
no_suite_data = "The {suite} suite has not been run for this build."
missing_suites = "No overall result: missing {suites}."
partial_suite = "The {suite} suite is only measured for part of its windows (missing {windows})."
