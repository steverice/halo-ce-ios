order = 10
heading = "Mac"
paragraph = "Average presentation rate, with the frame cap and vsync off, the matched-stock settings and a 2560×1920 drawable. Each bar is the geometric mean of the average over all of the suite's windows (Campaign: c10 and b30; Combat: a50-hangar, b40-exta and b30-bot; Cutscenes: x70-bridge and cutscene-rescue); a build missing any of them is listed under the chart instead. Under the chart, each build lists the median and 90th-percentile GPU time per rendered frame. Halo OG is limited by CPU command submission, not by a frame cap."
empty = "No Mac results yet."
box = "M6 Mac mini"
series_labels = ["Average fps"]

[chart]
type = "bar"
horizontal = true
x_label = "Port and version"
y_label = "Frames per second"
y_min = 0
palette = ["#1593bd", "#c8870a"]
marks = ["\U0001F7E6", "\U0001F7E8"]
header = '''
---
config:
  xyChart:
    width: 860
    height: 420
  themeVariables:
    xyChart:
      plotColorPalette: "__PALETTE__"
---
'''

[query]
platform = "Mac"
metrics = ["fps_avg"]
details = ["gpu_p50_ms", "gpu_p90_ms"]
port_order = ["visr", "opence-macos", "opence-web", "corece", "chupathingy", "halo-og"]
no_data_reason = "no uncapped 2560×1920 matched-stock measurement"

[query.suite_windows]
campaign = ["c10", "b30"]
combat = ["a50-hangar", "b40-exta", "b30-bot"]
cutscenes = ["x70-bridge", "cutscene-rescue"]

[query.filter]
frame_mode = "uncapped"
drawable = "2560×1920"
quality_preset = "matched-stock"
status = "ok"

[rename]
"OpenCE-macOS" = "OpenCE"
