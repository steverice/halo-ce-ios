order = 10
heading = "Mac"
paragraph = "Average presentation rate, with the frame cap and vsync off and the matched-stock settings. Each bar is the geometric mean of the average over the suite's windows. Under the chart, each build lists the median and 90th-percentile GPU time of a frame."
empty = "No Mac results yet."
box = "M6 Mac mini"
series_labels = ["Average fps"]

[chart]
type = "bar"
horizontal = true
x_label = "Port and version"
y_label = "Frames per second"
y_min = 0
palette = ["#1593bd", "#c8870a"]
marks = ["\U0001F7E6", "\U0001F7E8"]
header = '''
---
config:
  xyChart:
    width: 860
    height: 420
  themeVariables:
    xyChart:
      plotColorPalette: "__PALETTE__"
---
'''

[query]
platform = "Mac"
metrics = ["fps_avg"]
details = ["gpu_p50_ms", "gpu_p90_ms"]
port_order = ["visr", "opence-macos", "opence-web", "corece", "chupathingy", "halo-og"]
no_data_reason = "no uncapped matched-stock measurement"

[query.filter]
frame_mode = "uncapped"
quality_preset = "matched-stock"
status = "ok"

[rename]
"OpenCE-macOS" = "OpenCE"
