order = 30
heading = "Apple TV"
paragraph = "Measured on an Apple TV HD from runs presented at the frame cap of its profile, 30 fps. Bars show average fps and 1% low fps (the slowest 1% of frames); the table lists the share of frames that arrive on time, within 5% of the display interval."
empty = "No Apple TV results yet."
box = "Apple TV HD"
series_labels = ["Average fps", "1% low fps"]

[chart]
type = "bar"
horizontal = true
title_unit = "fps at the profile's frame cap"
x_label = "Port and version"
y_label = "Frames per second"
y_min = 0
palette = ["#1593bd", "#c8870a"]
marks = ["\U0001F7E6", "\U0001F7E8"]
header = '''
---
config:
  xyChart:
    width: 860
    height: 420
  themeVariables:
    xyChart:
      plotColorPalette: "__PALETTE__"
---
'''

[query]
platform = "Apple TV"
metrics = ["fps_avg", "fps_1pct_low"]
details = ["on_time_pct"]
port_order = ["visr", "opence-macos", "opence-web", "corece", "chupathingy", "halo-og"]
no_data_reason = "no measurement at the display rate"

[query.filter]
frame_mode = "capped"
quality_preset = "defaults"
status = "ok"
