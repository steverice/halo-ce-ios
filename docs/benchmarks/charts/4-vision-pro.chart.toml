order = 40
heading = "Vision Pro"
paragraph = "Measured on an M2 Vision Pro from runs presented at the display rate. Bars show average fps, drawn beside the 1% low fps where the app reports one; the table lists 95th-percentile frame time and the share of frames on time, within 5% of the display interval, where reported."
empty = "No Vision Pro results yet."
box = "M2 Vision Pro"
series_labels = ["Average fps", "1% low fps"]

[chart]
type = "bar"
horizontal = true
title_unit = "fps at display rate"
x_label = "Port and version"
y_label = "Frames per second"
y_min = 0
palette = ["#1593bd", "#c8870a"]
marks = ["\U0001F7E6", "\U0001F7E8"]
header = '''
---
config:
  xyChart:
    width: 520
    height: 263
  themeVariables:
    xyChart:
      plotColorPalette: "__PALETTE__"
---
'''

[query]
platform = "Vision Pro"
metrics = ["fps_avg", "fps_1pct_low"]
details = ["p95_ms", "on_time_pct"]
port_order = ["visr", "opence-macos", "opence-web", "corece", "chupathingy", "halo-og"]
no_data_reason = "no measurement at the display rate"

[query.build_notes]
visr = "Replays a recorded route."
master-chef = "Runs with no input, fixed at 30 fps as shipped; it has no setting to run faster and reports no frame times."

[query.filter]
frame_mode = ["capped", "display"]
quality_preset = "defaults"
status = "ok"

[rename]
"OpenCE-macOS" = "OpenCE"
