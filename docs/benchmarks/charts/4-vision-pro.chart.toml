order = 40
heading = "Vision Pro"
paragraph = "Average presentation rate and 1% low rate (the slowest 1% of frames), from runs presented at the device's display rate with each app's default settings. Each bar is the geometric mean of the average over the suite's windows, drawn beside the 1% low where the app reports one. master-chef: Fixed at 30 fps as shipped; it has no setting to run faster."
empty = "No Vision Pro results yet."
box = "M2 Vision Pro"
series_labels = ["Average fps", "1% low fps"]

[chart]
type = "bar"
horizontal = true
title_unit = "fps at display rate"
x_label = "Port and version"
y_label = "Frames per second"
y_min = 0
palette = ["#1593bd", "#c8870a"]
marks = ["\U0001F7E6", "\U0001F7E8"]
header = '''
---
config:
  xyChart:
    width: 520
    height: 263
  themeVariables:
    xyChart:
      plotColorPalette: "__PALETTE__"
---
'''

[query]
platform = "Vision Pro"
metrics = ["fps_avg", "fps_1pct_low"]
port_order = ["visr", "opence-macos", "opence-web", "corece", "chupathingy", "halo-og"]
