order = 20
heading = "iPhone and iPad"
paragraph = "Average presentation rate and 1% low rate (the slowest 1% of frames), from runs presented at the device's display rate. Each bar pair is the geometric mean of the average and of the 1% low over the suite's windows. Under the chart, each build lists the share of frames that arrive on time (within 5% of the display interval) where the app reports it. A build measured in only some of the suite's windows is charted from those windows, and the caption names the windows still to measure."
empty = "No iPhone or iPad results yet."
box = "M1 iPad Pro"
series_labels = ["Average fps", "1% low fps"]

[chart]
type = "bar"
horizontal = true
title_unit = "fps at display rate"
x_label = "Port and version"
y_label = "Frames per second"
y_min = 0
palette = ["#1593bd", "#c8870a"]
marks = ["\U0001F7E6", "\U0001F7E8"]
header = '''
---
config:
  xyChart:
    width: 860
    height: 420
  themeVariables:
    xyChart:
      plotColorPalette: "__PALETTE__"
---
'''

[query]
platform = "iPhone/iPad"
metrics = ["fps_avg", "fps_1pct_low"]
details = ["on_time_pct"]
windows = ["a10", "b30"]
port_order = ["visr", "opence-macos", "opence-web", "corece", "chupathingy", "halo-og"]
no_data_reason = "no measurement at the display rate"

[query.filter]
frame_mode = "capped"
quality_preset = "defaults"
status = "ok"

[rename]
"OpenCE-macOS" = "OpenCE"
