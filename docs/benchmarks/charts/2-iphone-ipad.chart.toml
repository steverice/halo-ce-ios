order = 20
heading = "iPhone and iPad"
paragraph = "Average presentation rate and 1% low rate (the slowest 1% of frames), with the frame cap and vsync off and the matched-stock settings. Each bar pair is the mean of the average and the median of the 1% low over the suite's windows."
empty = "No results yet for the M1 iPad Pro."
box = "M1 iPad Pro"
series_labels = ["Average fps", "1% low fps"]

[chart]
type = "bar"
horizontal = true
x_label = "Port and version"
y_label = "Frames per second"
y_min = 0
marks = ["\U0001F7E6", "\U0001F7E7"]
header = '''
---
config:
  xyChart:
    width: 860
    height: 420
  themeVariables:
    xyChart:
      plotColorPalette: "#2f6fed, #f28c28"
---
'''

[query]
platform = "iPhone/iPad"
metrics = ["fps_avg", "fps_1pct_low"]
port_order = ["visr", "opence-macos", "opence-web", "corece", "chupathingy", "halo-og"]
no_data_reason = "no uncapped matched-stock measurement"

[query.filter]
frame_mode = "uncapped"
delay_s = "0"
quality_preset = "matched-stock"
status = "ok"

[rename]
"OpenCE-macOS" = "OpenCE"
