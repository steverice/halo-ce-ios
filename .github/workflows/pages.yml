name: Pages

# Publishes the static landing page in docs/site to GitHub Pages. There is no
# application build step. Signed asset feeds are validated before upload. Enable it under
# Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/pages.yml'
      - 'tools/build_site.py'
      - 'tools/site_template.html'
      - 'tools/requirements-ci.*'
      - 'tools/pages_asset_overlay.py'
      - 'tools/pages_recording_overlay.py'
      - 'tools/release_validation.py'
      - 'tools/data_pack.py'
      - 'tools/data_pack_sign.c'
      - 'port/third_party/monocypher/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.8'
      - name: Build landing page from Markdown
        run: |
          uv run --python 3.11 --no-project --with-requirements tools/requirements-ci.txt \
            python tools/build_site.py
      - name: Validate and stage checked-in main assets
        run: |
          uv run --python 3.11 --no-project --with-requirements tools/release-requirements.txt \
            python tools/pages_asset_overlay.py
          rm -- build/pages/index.md build/pages/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - id: deployment
        uses: actions/deploy-pages@v4
