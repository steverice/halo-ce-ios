name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validate unsigned provenance, or perform an approved release'
        type: choice
        options: [validate, release]
        default: validate
      source_sha:
        description: 'Reviewed full main commit SHA (source SHA when resuming)'
        required: true
        type: string
      platforms:
        description: 'Existing App Store platforms: ios,tvos,visionos (comma-separated)'
        default: 'ios,tvos'
        type: string
      increment:
        description: 'Commitizen version increment'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      resume_tag:
        description: 'Recover an existing visr-vX.Y.Z tag; never bumps again'
        type: string
      bootstrap_since:
        description: 'First managed release only: reviewed full ancestor SHA for changelog boundary'
        type: string
      bootstrap_version:
        description: 'First managed release only: current TestFlight marketing version'
        type: string
        default: '0.1.2'

permissions:
  contents: read

concurrency:
  group: visr-release
  cancel-in-progress: false

# The xcode-27 image inventory includes this exact build. Never follow its default Xcode.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.2_beta_2.app/Contents/Developer

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.8'
      - name: Build unsigned optimized tester provenance without publishing
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
        run: |
          brew install cmake ninja llvm lld sdl3 pkgconf
          uv run --python 3.11 --no-project --with-requirements tools/release-requirements.txt python tools/release_validation.py probe \
            --source-sha "$SOURCE_SHA" --platforms "$RELEASE_PLATFORMS" --report build/release-probe.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-provenance
          path: build/release-probe.json
          if-no-files-found: error
          retention-days: 30

  preflight:
    needs: probe
    if: inputs.mode == 'release'
    runs-on: xcode-27
    timeout-minutes: 15
    environment: release
    outputs:
      identity: ${{ steps.check.outputs.identity }}
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
      APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      APPLE_PROFILE_IOS_BASE64: ${{ secrets.APPLE_PROFILE_IOS_BASE64 }}
      APPLE_PROFILE_TVOS_BASE64: ${{ secrets.APPLE_PROFILE_TVOS_BASE64 }}
      APPLE_PROFILE_VISIONOS_BASE64: ${{ secrets.APPLE_PROFILE_VISIONOS_BASE64 }}
      RELEASE_PLATFORMS: ${{ inputs.platforms }}
      RELEASE_BUILD_POLICY: ${{ vars.RELEASE_BUILD_POLICY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source is on main before using credentials
        id: trusted-source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.8'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-provenance
          path: evidence
      - name: Require all selected existing credentials
        run: python3 -c 'import os; from tools.release import platforms; from tools.release_validation import check_credentials; check_credentials(os.environ, platforms(os.environ["RELEASE_PLATFORMS"]))'
      - name: Validate existing distribution identity and profiles
        run: python3 tools/release_signing.py install
      - name: Verify reviewed guest, feeds, toolchain, and App Store access before any tag
        id: check
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          uv run --python 3.11 --no-project --with-requirements tools/release-requirements.txt python tools/release_validation.py check \
            --source-sha "$SOURCE_SHA" --platforms "$RELEASE_PLATFORMS" --report evidence/release-probe.json
      - name: Remove signing material
        if: always() && steps.trusted-source.outcome == 'success'
        run: python3 tools/release_signing.py cleanup

  prepare:
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.8'
      - name: Generate and commit release metadata
        id: prepare
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
          RELEASE_BUILD_POLICY: ${{ vars.RELEASE_BUILD_POLICY }}
          RELEASE_PREFLIGHT_IDENTITY: ${{ needs.preflight.outputs.identity }}
          INCREMENT: ${{ inputs.increment }}
          RESUME_TAG: ${{ inputs.resume_tag }}
          BOOTSTRAP_SINCE: ${{ inputs.bootstrap_since }}
          BOOTSTRAP_VERSION: ${{ inputs.bootstrap_version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          uv run --python 3.11 --no-project --with-requirements tools/release-requirements.txt python tools/release.py prepare \
            --source-sha "$SOURCE_SHA" --platforms "$RELEASE_PLATFORMS" --increment "$INCREMENT" \
            --resume-tag "$RESUME_TAG" --bootstrap-since "$BOOTSTRAP_SINCE" --bootstrap-version "$BOOTSTRAP_VERSION"

  testflight:
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 180
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
      RELEASE_BUILD_POLICY: ${{ vars.RELEASE_BUILD_POLICY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.8'
      - name: Install build dependencies
        run: brew install cmake ninja llvm lld sdl3 pkgconf
      - name: Install existing signing material
        env:
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROFILE_IOS_BASE64: ${{ secrets.APPLE_PROFILE_IOS_BASE64 }}
          APPLE_PROFILE_TVOS_BASE64: ${{ secrets.APPLE_PROFILE_TVOS_BASE64 }}
          APPLE_PROFILE_VISIONOS_BASE64: ${{ secrets.APPLE_PROFILE_VISIONOS_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 tools/release_signing.py install
      - name: Build, upload, reconcile exact TestFlight builds, and publish release
        run: uv run --python 3.11 --no-project --with-requirements tools/release-requirements.txt python tools/release.py publish
      - name: Remove signing material
        if: always()
        run: python3 tools/release_signing.py cleanup
