name: iOS

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'research/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'research/**']
  workflow_dispatch:

# The hosted image publishes all three Apple SDK families for Xcode 26.6.
# Keep this explicit so a runner default change cannot silently switch compilers.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: build/third_party
          key: apple-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ios_guest_build.py') }}
      - name: Toolchain
        run: |
          test "$(uname -m)" = arm64
          brew install cmake ninja llvm lld sdl3 pkgconf
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk xros --show-sdk-path
          /opt/homebrew/opt/llvm/bin/clang --version
          /opt/homebrew/opt/lld/bin/ld.lld --version
      - name: Validate Catalyst OpenGLES stub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from tools.ios_build import opengles_framework
          with TemporaryDirectory() as folder:
              opengles_framework(Path(folder))
          print("Catalyst OpenGLES stub validated")
          PY
      - name: Metal compiler for native stereo probes
        run: |
          if ! xcrun --sdk xros metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk xros metal --version
      - name: ABI, memory, audio, and XISO regressions
        run: python3 tools/ios_test.py
      - name: Build unsigned device IPA
        run: python3 tools/ios_build.py --unsigned --jobs 3 --ipa dist/VISR-iOS-unsigned.ipa
      - name: Build Mac Catalyst app
        run: python3 tools/ios_build.py --mac --jobs 3
      - name: Build ARM64 simulator app
        run: python3 tools/ios_build.py --simulator --jobs 3
      - name: Archive simulator app
        run: ditto -c -k --keepParent build/ios/app-simulator/Release-iphonesimulator/VISR.app dist/VISR-simulator.zip
      - name: Verify packaged artifacts
        working-directory: dist
        run: |
          shasum --algorithm 256 --check VISR-iOS-unsigned.ipa.sha256
          test -s VISR-simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visr-ios-unsigned
          path: |
            dist/VISR-iOS-unsigned.ipa
            dist/VISR-iOS-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visr-ios-simulator
          path: dist/VISR-simulator.zip
          if-no-files-found: error
          retention-days: 14

  tvos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: build/third_party
          key: apple-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ios_guest_build.py') }}
      - name: Toolchain
        run: |
          test "$(uname -m)" = arm64
          brew install cmake ninja llvm lld sdl3 pkgconf
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Verify Apple TV SDKs
        run: |
          xcrun --sdk appletvos --show-sdk-path
          xcrun --sdk appletvsimulator --show-sdk-path
      # Like iOS, the app ships no game data: it imports the player's XISO
      # over the local network (port/ios/host/host_tv_import.m).
      - name: Build unsigned Apple TV IPA
        run: python3 tools/ios_build.py --tvos --unsigned --jobs 3 --ipa dist/VISR-tvOS-unsigned.ipa
      - name: Build ARM64 Apple TV simulator app
        run: python3 tools/ios_build.py --tvos --simulator --jobs 3
      - name: Archive simulator app
        run: ditto -c -k --keepParent build/tvos/app-simulator/Release-appletvsimulator/VISR.app dist/VISR-tvOS-simulator.zip
      - name: Verify packaged artifacts
        working-directory: dist
        run: |
          shasum --algorithm 256 --check VISR-tvOS-unsigned.ipa.sha256
          test -s VISR-tvOS-simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visr-tvos-unsigned
          path: |
            dist/VISR-tvOS-unsigned.ipa
            dist/VISR-tvOS-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visr-tvos-simulator
          path: dist/VISR-tvOS-simulator.zip
          if-no-files-found: error
          retention-days: 14
  visionos:
    runs-on: macos-26
    timeout-minutes: 60
    # Existing advisory job; promote after its first verified hosted run (docs/ci.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: build/third_party
          key: apple-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ios_guest_build.py') }}
      - name: Toolchain
        run: |
          test "$(uname -m)" = arm64
          brew install cmake ninja llvm lld sdl3 pkgconf
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk xros --show-sdk-path
          xcrun --sdk xrsimulator --show-sdk-path
      # Metal only; the XISO comes in through Files or the Documents folder
      # (port/ios/host/host_import.m).
      - name: Build unsigned Apple Vision Pro IPA
        run: python3 tools/ios_build.py --visionos --unsigned --jobs 3 --ipa dist/VISR-visionOS-unsigned.ipa
      - name: Build ARM64 Apple Vision Pro simulator app
        run: python3 tools/ios_build.py --visionos --simulator --jobs 3
      - name: Archive simulator app
        run: ditto -c -k --keepParent build/visionos/app-simulator/Release-xrsimulator/VISR.app dist/VISR-visionOS-simulator.zip
      - name: Verify packaged artifacts
        working-directory: dist
        run: |
          shasum --algorithm 256 --check VISR-visionOS-unsigned.ipa.sha256
          test -s VISR-visionOS-simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visr-visionos-unsigned
          path: |
            dist/VISR-visionOS-unsigned.ipa
            dist/VISR-visionOS-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visr-visionos-simulator
          path: dist/VISR-visionOS-simulator.zip
          if-no-files-found: error
          retention-days: 14
