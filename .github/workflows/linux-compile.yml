name: Linux release compile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/linux-compile.yml
      - configure.py
      - config/**
      - port/**
      - source/**
      - tools/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/linux-compile.yml
      - configure.py
      - config/**
      - port/**
      - source/**
      - tools/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      - name: Install 32-bit Linux toolchain
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman --sync --refresh --sysupgrade --noconfirm --needed git zstd python python-pytest ninja \
            clang lld gcc lib32-glibc lib32-gcc-libs lib32-sdl3
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build complete Linux release
        run: python tools/ci_build.py linux release
      - name: Verify executable and focused behavior
        run: |
          test -s dist/halo-linux-release/halo
          python - <<'PY'
          from pathlib import Path
          image = Path('dist/halo-linux-release/halo').read_bytes()
          assert image[:4] == b'\x7fELF' and image[4] == 1, 'expected a 32-bit ELF executable'
          assert int.from_bytes(image[18:20], 'little') == 3, 'expected x86 machine code'
          print('32-bit x86 Linux executable verified')
          PY
          python -m pytest --quiet \
            tools/test_linux_port.py::test_network_format_is_the_recorded_one \
            tools/test_linux_port.py::test_p2p_signatures_and_listings \
            tools/harness/tests/test_unicode_line_breaks.py \
            tools/harness/tests/test_sound_orphan.py \
            tools/harness/tests/test_queue_reset.py \
            tools/harness/tests/test_coop_monitor.py \
            tools/harness/tests/test_button_presets.py
