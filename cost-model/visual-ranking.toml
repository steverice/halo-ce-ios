# Visual cost of each step down a setting's ladder, per output class, graded by looking at the result.
# `order` runs from best quality to cheapest. `grade` rates arriving at that value: invisible, barely or obvious.
# Knobs absent from this file are never proposed. basis = "assumed" marks values not yet graded by eye.
basis = "assumed"

[handheld."display.shadow_map_size"]
order = ["512", "256", "128"]
grade = {"256" = "barely", "128" = "obvious"}

[handheld."display.anisotropic_filtering"]
order = ["16", "8", "4", "2"]
grade = {"8" = "invisible", "4" = "barely", "2" = "obvious"}

[handheld."display.model_lod"]
order = ["max", "auto"]
grade = {"auto" = "barely"}

[handheld."display.render_lines"]
order = ["1080", "810", "540"]
grade = {"810" = "barely", "540" = "obvious"}

[tv."display.shadow_map_size"]
order = ["512", "256", "128"]
grade = {"256" = "barely", "128" = "obvious"}

[tv."display.anisotropic_filtering"]
order = ["16", "8", "4", "2"]
grade = {"8" = "invisible", "4" = "barely", "2" = "obvious"}

[tv."display.model_lod"]
order = ["max", "auto"]
grade = {"auto" = "barely"}

[tv."display.render_lines"]
order = ["1080", "810", "540"]
grade = {"810" = "barely", "540" = "obvious"}

[handheld."display.clutter_distance"]
order = ["0", "80", "40", "20"]
grade = {"80" = "invisible", "40" = "barely", "20" = "obvious"}

[handheld."debug.clutter_lowest_lod"]
order = ["off", "on"]
grade = {"on" = "barely"}

[tv."display.clutter_distance"]
order = ["0", "80", "40", "20"]
grade = {"80" = "invisible", "40" = "barely", "20" = "obvious"}

[tv."debug.clutter_lowest_lod"]
order = ["off", "on"]
grade = {"on" = "barely"}

[handheld."display.anti_aliasing"]
order = ["smaa", "fxaa", "off"]
grade = {"fxaa" = "barely", "off" = "obvious"}

[handheld."display.effect_resolution"]
order = ["full", "half", "xbox"]
grade = {"half" = "barely", "xbox" = "barely"}

[tv."display.anti_aliasing"]
order = ["smaa", "fxaa", "off"]
grade = {"fxaa" = "barely", "off" = "obvious"}

[tv."display.effect_resolution"]
order = ["full", "half", "xbox"]
grade = {"half" = "barely", "xbox" = "barely"}

# The simulation switches below are exact: they change how much work a query does and not what it returns
# (zero global-seed misses against off), so arriving at "on" is invisible. Experimental, default off.

[handheld."debug.collision_type_filter"]
order = ["off", "on"]
grade = {"on" = "invisible"}

[handheld."debug.sphere_query_type_filter"]
order = ["off", "on"]
grade = {"on" = "invisible"}

[handheld."debug.static_light_relink"]
order = ["off", "on"]
grade = {"on" = "invisible"}

[handheld."debug.collision_candidates"]
order = ["off", "on"]
grade = {"on" = "invisible"}

[tv."debug.collision_type_filter"]
order = ["off", "on"]
grade = {"on" = "invisible"}

[tv."debug.sphere_query_type_filter"]
order = ["off", "on"]
grade = {"on" = "invisible"}

[tv."debug.static_light_relink"]
order = ["off", "on"]
grade = {"on" = "invisible"}

# debug.immediate_merge is exact and on in every build, so it is not a ladder knob.

[tv."debug.collision_candidates"]
order = ["off", "on"]
grade = {"on" = "invisible"}
