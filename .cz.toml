[tool.commitizen]
name = "cz_customize"
version_provider = "scm"
version_scheme = "semver2"
tag_format = "visr-v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true
bump_message = "🔧 chore(release): $current_version → $new_version"

# Existing optional gitmoji prefixes and the repository's full type vocabulary are intentional.
[tool.commitizen.customize]
schema = "<gitmoji> <type>(<scope>): <description>"
schema_pattern = '^(?:[^\w\s]+\s+)?(?:feat|fix|perf|refactor|docs|test|build|ci|chore|revert|merge|style)(?:\([^\n)]+\))?!?: .+'
bump_pattern = '^(?:[^\w\s]+\s+)?((?:feat|fix|perf)(?:\([^\n)]+\))?!?:|\w+(?:\([^\n)]+\))?!:|BREAKING CHANGE:)'
bump_map = { '.*!|BREAKING CHANGE' = "MAJOR", '.*feat' = "MINOR", '.*fix|.*perf' = "PATCH" }
changelog_pattern = '^(?:[^\w\s]+\s+)?(?:feat|fix|perf|refactor|docs|test|build|ci|chore|revert|merge|style)(?:\([^\n)]+\))?!?:'
commit_parser = '^(?:[^\w\s]+\s+)?(?P<change_type>feat|fix|perf|refactor|docs|test|build|ci|chore|revert|merge|style)(?:\((?P<scope>[^\n)]+)\))?!?: (?P<message>.*)'
change_type_order = ["feat", "fix", "perf", "refactor", "build", "revert", "docs", "test", "ci", "chore", "merge", "style"]
